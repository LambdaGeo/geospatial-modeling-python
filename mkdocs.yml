site_name: Geospatial Modeling with Python
site_description: >
  A practical guide to geographic data science and discrete spatial simulation
  using the Python ecosystem and the DisSModel framework.
site_author: "Sergio Souza Costa"

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  font: false
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode

plugins:
  - search
  - mkdocs-jupyter:
      include: ["*.ipynb"]
      execute: false
      markdown_extensions:
        - admonition
        - pymdownx.details
        - pymdownx.superfences

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/lambdageo.css

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js

nav:
  - "⇦ LambdaGeo ebooks": https://lambdageo.github.io/ebooks/
  - Home: index.md

  - Part I — Scientific Python for Researchers:
    - "Ch 1: The Scientific Python Ecosystem":          part1/ch01_ecosystem.ipynb
    - "Ch 2: The Geospatial Python Toolbox":            part1/ch02_toolbox.ipynb
    - "Ch 3: Tabular Data with Pandas":                 part1/ch03_pandas.ipynb
    - "Ch 4: Data Cleaning and Exploratory Analysis":    part1/ch04_cleaning_eda.ipynb
    - "Ch 5: Software Engineering for Scientific Python": part1/ch05_software_eng.ipynb

  - Part II — Geographic Data Science:
    - "Ch 6: Introduction to Spatial Data":            part2/ch06_spatial_intro.ipynb
    - "Ch 7: Vector Data with GeoPandas":              part2/ch07_vector.ipynb
    - "Ch 8: Raster Data with NumPy and rasterio":     part2/ch08_raster.ipynb
    - "Ch 9: Multidimensional Arrays with Xarray":     part2/ch09_xarray.ipynb
    - "Ch 10: Spatial Relationships and Weights":      part2/ch10_weights.ipynb
    - "Ch 11: Exploratory Spatial Data Analysis":      part2/ch11_esda.ipynb
    - "Ch 12: Visualizing Spatial Data":               part2/ch12_visualization.ipynb
    - "Ch 13: Raster-Vector Integration Patterns":     part2/ch13_integration.ipynb

  - Part III — Discrete Spatial Modeling:
    - "Ch 14: Paradigms of Spatial Simulation":           part3/ch14_paradigms.ipynb
    - "Ch 15: Cellular Automata from Scratch":            part3/ch15_ca.ipynb
    - "Ch 16: Discrete-Event Simulation with salabim":    part3/ch16_des.ipynb
    - "Ch 17: The Performance Problem — and the Solution": part3/ch17_performance.ipynb
    - "Ch 18: Introducing DisSModel":                     part3/ch18_dissmodel.ipynb
    - "Ch 19: Building Models with DisSModel":            part3/ch19_building.ipynb
    - "Ch 20: Land Use and Cover Change Modeling":        part3/ch20_lucc.ipynb
    - "Ch 21: Case Study — Coastal Dynamics":             part3/ch21_coastal.ipynb
    - "Ch 22: Reproducibility and Experiment Provenance": part3/ch22_provenance.ipynb

  - Part IV — DisSModel in Practice:
    - "Ch 23: DisSModel and the Brazilian EO Ecosystem": part4/ch23_ecosystem.ipynb
    - "Ch 24: Running Models with the DisSModel Platform": part4/ch24_platform.ipynb
    - "Ch 25: Ensemble Scenarios and Sensitivity Analysis": part4/ch25_ensemble.ipynb
